{% extends "base.html" %}
{% block contenu %}

<h1>EQUIPE {{ index + 1 }} / {{ nb }}</h1>
<div class="trait"></div>
<p class="sous-titre">Sport : <span style="color:#e63946; font-weight:500;">{{ sport }}</span></p>

{% if erreur %}
<div class="erreur">{{ erreur }}</div>
{% endif %}

<div class="carte">
    <form method="POST">
        <div class="form-group">
            <label>Nom de l'équipe</label>
            <input type="text" name="nom_equipe" placeholder="Ex : Les Lions">
        </div>

        <div class="form-group">
            <label>Membres (séparés par des virgules)</label>
            <input type="text" name="membres" placeholder="Ex : Alice, Bob, Charlie">
        </div>

        <div class="btn-groupe">
            {% if index < nb - 1 %}
            <button type="submit" class="btn btn-rouge">Equipe suivante →</button>
            {% else %}
            <button type="submit" class="btn btn-rouge">Terminer ✓</button>
            {% endif %}
        </div>
    </form>
</div>

{% endblock %}
